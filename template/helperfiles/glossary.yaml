sUpc:
  short: $U'_c$
  description: uninterrupted @uptime:pl:short:noref of a connection $c in $ @sC:short:noref
  group: Symbol

sDc:
  short: $D_c$
  description: $$@downtime:pl:short:noref of a connection $c in $ @sC:short:noref
