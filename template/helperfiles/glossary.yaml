sCn:
  short: $C_n$
  description: connections between a node pair $n in$ @sNp:short:noref
  group: Symbol

slc:
  short: $l_c$
  description: connection distance (length) of $c in$ @sC:short:noref
  group: Symbol

sCh:
  short: $C_h$
  description: connections containing a hyperlink $h in$ @sH:short:noref
  group: Symbol

sHn:
  short: $H_n$
  description: hyperlinks involved in connections @sCn:short:noref
  group: Symbol

saRHO:
  short: $alpha_rho$
  description: shape parameter of InverseGamma modeling @sRHO:short:noref, \ with prior being the posterior of @sar:short:noref
  group: Symbol

sbRHO:
  short: $beta_rho$
  description: scale parameter of InverseGamma modeling @sRHO:short:noref, \ with prior being the posterior of @sbr:short:noref
  group: Symbol

sPPHIh:
  short: $Phi_h$
  description: prior for @sPHIhh:short:noref
  group: Symbol

sPPHIb:
  short: $Phi_b$
  description: prior for @sPHIhb:short:noref
  group: Symbol

sPPHIt:
  short: $Phi_t$
  description: prior for @sPHIht:short:noref
  group: Symbol

sP:
  short: $P$
  description: all possible internal paths
  group: Symbol

sPn:
  short: $P_n$
  description: past logged internal paths used between an internal \ node pair $n in $ @sN:short:noref
  group: Symbol

sMp:
  short: $M_p$
  description: number of times that path $p in P$ has been deployed 
  group: Symbol

sRhat:
  short: $hat(R)$
  description: potential scale reduction factor, also known as R-hat
  group: Symbol

sdG:
  short: $d_G$
  description: the standard deviation of the link distances in topology $G$
  group: Symbol


