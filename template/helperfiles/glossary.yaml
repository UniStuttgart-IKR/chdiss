# Symbol

sD:
  short: $D$
  description: $$@downtime:pl:short:noref
  group: Symbol

sDe:
  short: $D_e$
  description: $$@downtime:pl:short:noref of a link $e in $ @sE:short:noref
  group: Symbol

sU:
  short: $U$
  description: $$@uptime:pl:short:noref
  group: Symbol

sUe:
  short: $U_e$
  description: $$@uptime:pl:short:noref of a link $e in $ @sE:short:noref
  group: Symbol

sDp:
  short: $D'$
  description: uninterrupted @downtime:pl:short:noref. $|D'|$ is the number of repairs
  group: Symbol

sDpe:
  short: $D'_e$
  description: uninterrupted @downtime:pl:short:noref of a link $e in $ @sE:short:noref
  group: Symbol

sUp:
  short: $U'$
  description: uninterrupted @uptime:pl:short:noref. $|U'|$ is the number of failures
  group: Symbol

sUpe:
  short: $U'_e$
  description: uninterrupted @uptime:pl:short:noref of a link $e in $ @sE:short:noref
  group: Symbol

srh: 
  short: $hat(r)$
  description: $$@sr:short:noref estimate
  group: Symbol

sr: 
  short: $r$
  description: $$@trueavailability:short:noref[true] @mtbr:short:noref of all links @sE:short:noref
  group: Symbol

sfhe: 
  short: $hat(f_e)$
  description: $$@sfe:short:noref estimate
  group: Symbol

sae: 
  short: $a_e$
  description: $$@trueavailability:short:noref of a link $e in $ @sE:short:noref
  group: Symbol

sahe: 
  short: $hat(a_e)$
  description: availability estimate given @sfhe:short:noref and @srh:short:noref
  group: Symbol

sfe: 
  short: $f_e$
  description: $$@trueavailability:short:noref[true] @mtbf:short:noref of a link $e in $ @sE:short:noref
  group: Symbol

sar:
  short: $alpha_r$
  description: shape parameter of InverseGamma modeling @srh:short:noref 
  group: Symbol

sbr:
  short: $beta_r$
  description: scale parameter of InverseGamma modeling @srh:short:noref 
  group: Symbol

safe:
  short: $alpha_f$
  description: shape parameter of InverseGamma modeling @sfhe:short:noref
  group: Symbol

sbfe:
  short: $beta_f^e$
  description: scale parameter of InverseGamma modeling @sfhe:short:noref
  group: Symbol

sE: 
  short: $E$
  description: physical links (edges) of a network topology
  group: Symbol

sfb:
  short: $breve(f)$
  description: estimation function of @sfe:short:noref over continuous link length
  group: Symbol

sab:
  short: $breve(a)$
  description: availability estimation function given @sfb:short:noref and @srh:short:noref
  group: Symbol

sle:
  short: $l_e$
  description: length of link $e in $ @sE:short:noref 
  group: Symbol

ss:
  short: $s$
  description: proportionality factor of the reciprocal relationship modeling @sfb:short:noref
  group: Symbol

sk:
  short: $k$
  description: constant term of the reciprocal relationship modeling @sfb:short:noref
  group: Symbol

sak:
  short: $alpha_k$
  description: shape parameter of Gamma modeling @sk:short:noref
  group: Symbol

sbk:
  short: $beta_k$
  description: scale parameter of Gamma modeling @sk:short:noref
  group: Symbol

sas:
  short: $alpha_s$
  description: shape parameter of Gamma modeling @ss:short:noref
  group: Symbol

sbs:
  short: $beta_s$
  description: scale parameter of Gamma modeling @ss:short:noref
  group: Symbol

sH:
  short: $H$
  description: hyperlinks set
  group: Symbol

sDh:
  short: $D_h$
  description: $$@downtime:pl:short:noref of a hyperlink $h in $ @sH:short:noref
  group: Symbol
sUh:
  short: $U_h$
  description: $$@uptime:pl:short:noref of a hyperlink $h in $ @sH:short:noref
  group: Symbol
sDph:
  short: $D'_h$
  description: uninterrupted @downtime:pl:short:noref of a hyperlink $h in $ @sH:short:noref
  group: Symbol
sUph:
  short: $U'_h$
  description: uninterrupted @uptime:pl:short:noref of a hyperlink $h in $ @sH:short:noref
  group: Symbol

sRHO:
  short: $hat(rho)$
  description: $$@mtbr:short:noref estimate of all hyperlinks @sH:short:noref
  group: Symbol

sPHIhh:
  short: $hat(phi_h)$
  description: $$@mtbf:short:noref estimate of a hyperlink $h in $ @sH:short:noref
  group: Symbol

sPHIhn: 
  short: $hat(phi_n)$
  description: $$@mtbf:short:noref estimate of a @crossdomain:short:noref connection $n in$ @sNp:short:noref
  group: Symbol

sPHIhnH: 
  short: $hat(phi_n^H)$
  description: $$@mtbf:short:noref estimate of a @crossdomain:short:noref connection $n in $ @sNp:short:noref, \ considering only the influence of the hyperlinks @sHn:short:noref, \ by averaging over @sPHIhc:short:noref $forall med c in $ @sCn:short:noref.
  group: Symbol

sB:
  short: $B$
  description: $$@crossdomain:short:noref border nodes
  group: Symbol
sT:
  short: $T$
  description: $$@crossdomain:short:noref target nodes
  group: Symbol
sN:
  short: $N$
  description: internal node pair combinations defining an \ @intradomain:short:noref connection
  group: Symbol
sNp:
  short: $N'$
  description: external node pair combinations (@sB:short:noref $times$ @sT:short:noref) defining \ @crossdomain:short:noref connections @sC
  group: Symbol
sC:
  short: $C$
  description: $$@crossdomain:short:noref connections between @sNp:short:noref $=$ @sB:short:noref $times$ @sT:short:noref
  group: Symbol
sHc:
  short: $H_c$
  description: hyperlinks involved in a connection $c in$ @sC:short:noref
  group: Symbol

sPHIhb: 
  short: $hat(phi_b)$
  description: $$@mtbf:short:noref estimate based on a border node $b in $ @sB:short:noref
  group: Symbol

sPHIht: 
  short: $hat(phi_t)$
  description: $$@mtbf:short:noref estimate based on an external target node $t in $ @sT:short:noref
  group: Symbol

sPHIhc: 
  short: $hat(phi_c)$
  description: $$@mtbf:short:noref estimate of a @crossdomain:short:noref connection $c in $ @sC:short:noref, \ based on the @sPHIhh:short:noref of the serial hyperlinks $h in $ @sHc:short:noref
  group: Symbol

